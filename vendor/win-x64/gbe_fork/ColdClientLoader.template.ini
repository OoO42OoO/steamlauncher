# Template ColdClientLoader.ini consumed by steamclient_loader_x64.exe.
# The DRM patcher (apps/desktop/src/main/drm-patcher.ts) writes a
# realised copy of this file next to the main game exe, substituting
# {{EXE_NAME}} and {{APPID}} at patch time.
#
# Upstream reference: gbe_fork release-2026_05_19, steamclient_experimental/ColdClientLoader.ini
[SteamClient]
# Upstream gbe_fork ColdClientLoader (tools/steamclient_loader/win/
# ColdClientLoader.cpp) unconditionally checks that BOTH dll files exist
# on disk before launching the target — even for an x64-only game, the
# x64 loader still file_exist()s `SteamClientDll` (the 32-bit one) and
# bails with "Couldn't find the requested SteamClientDll" if it's
# missing. So we ship BOTH steamclient.dll (x86) and steamclient64.dll
# (x64) from gbe_fork's experimental/ tree and point each key at the
# matching arch. The 32-bit dll is purely a sanity-check probe for the
# x64 loader — it's only LoadLibrary()'d when the loader's own arch
# matches a 32-bit target, which we never have.
SteamClient64Dll=steamclient64.dll
SteamClientDll=steamclient.dll
Exe={{EXE_NAME}}
ExeRunDir=
ExeCommandLine=
AppId={{APPID}}

[Injection]
ForceInjectSteamClient=1
ForceInjectGameOverlayRenderer=0
DllsToInjectFolder=
IgnoreInjectionError=1
IgnoreLoaderArchDifference=0

[Persistence]
Mode=1

[Debug]
ResumeByDebugger=0
